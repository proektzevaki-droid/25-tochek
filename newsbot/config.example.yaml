# ── Кто имеет право пользоваться ботом ───────────────────────────────────────
# Ваш Telegram user_id (узнать: напишите @userinfobot, либо запустите login.py).
# Пустой список = доступ всем, кто найдёт бота.
owner_ids: []

storage:
  db_path: "newsbot.db"
  session: "newsbot.session"   # файл сессии юзербота, создаётся скриптом login.py

# ── Как часто и как глубоко смотрим каналы ───────────────────────────────────
scan:
  interval_sec: 300        # цикл опроса каналов, сек
  min_age_minutes: 15      # пост «настаивается»: раньше реакции ещё не набрались
  max_age_hours: 24        # глубже в историю не заглядываем
  fetch_limit: 100         # сколько последних постов тянуть из канала за цикл
  pause_between_channels_sec: 2

# ── Фильтр ───────────────────────────────────────────────────────────────────
filter:
  # Как объединять условия популярности:
  #   any — достаточно одного сработавшего, all — нужны все включённые
  mode: any

  # ▸ ФИЛЬТР ПО ПОРЯДКУ РЕАКЦИЙ
  # Смотрит не на количество, а на то, какая эмодзи в посте на первом месте,
  # какая на втором и т.д. Платная звезда ⭐ в рейтинге не участвует: в Telegram
  # она всегда закреплена первой, а «первый смайл» для человека — следующий.
  #
  # match:
  #   prefix   — шаблон совпадает с началом рейтинга (👍 первый, 🔥 второй)
  #   anywhere — эмодзи шаблона идут подряд в любом месте рейтинга
  #   top_set  — те же эмодзи в топе, порядок не важен
  # gate:
  #   true  — обязательное условие: не совпал порядок → пост не берём (по умолчанию)
  #   false — обычное условие, участвует в mode any/all наравне с порогами
  #
  # Шаблон можно писать эмодзи ["👍", "🔥"], слитно "👍🔥" или словами "класс, огонь".
  reaction_pattern:
    enabled: false
    gate: true
    match: prefix
    patterns: []

  # ▸ ФИЛЬТР ПО КОЛИЧЕСТВУ
  min_reactions: 100       # абсолютный порог реакций (0 = выключить условие)

  relative:                # адаптивный порог: «заметно выше обычного для канала»
    enabled: true
    factor: 2.0            # реакций >= медиана канала * factor
    min_samples: 20        # пока постов в статистике меньше — условие не работает
    floor: 20              # ниже этого числа реакций не пропускать никогда

  min_engagement_rate: 0.0 # реакции / просмотры, напр. 0.02 = 2% (0 = выключить)
  min_views: 0             # минимум просмотров (0 = выключить)

  # ▸ ЖЁСТКИЕ ОТСЕЧКИ (работают всегда, независимо от mode)
  keywords_include: []     # если непусто — в тексте должно быть хоть одно слово
  keywords_exclude: []     # если найдено — пост отбрасывается
  skip_forwards: false     # true — игнорировать репосты из других каналов

# ── Доставка ─────────────────────────────────────────────────────────────────
delivery:
  mode: instant            # instant — сразу как пост прошёл фильтр
                           # digest  — копить и слать пачкой по расписанию
  digest_times: ["09:00", "19:00"]
  timezone: "Europe/Moscow"
  max_per_batch: 15        # предохранитель от «простыни» за раз
  send_interval_sec: 3     # пауза между сообщениями (антифлуд Telegram)
  text_preview_chars: 350

# ── Каналы ───────────────────────────────────────────────────────────────────
# username — как в ссылке t.me/<username>. Для приватных каналов укажите
# id: -1001234567890 и подпишите на них аккаунт юзербота.
# Любой параметр из filter можно переопределить для конкретного канала.
channels:
  # Правило вместо перечисления пар: гнев и скорбь не должны попадать в первые
  # две реакции. Выведено по 36 постам — 26 нужных и 10 ненужных.
  # Списки для позиций разные: во второй у Андрея спокойно проходят 👎 и 🙏,
  # а вот 🤬 не годится ни первым, ни вторым.
  - username: "OstashkoNews"
    title: "Осташко! Важное"
    reaction_pattern:
      enabled: true
      gate: true
      match: prefix
      patterns:
        - "!🤬|😢|😭|🙏|💩|🤮|💔|🕊|👎, !🤬|😢|😭"
    min_reactions: 0             # порог по количеству выключен
    relative:
      enabled: false             # адаптивный порог тоже не нужен

    # Запасной вариант — жёсткое перечисление, если правило выше окажется
    # слишком широким. Первая позиция: одна из семи, вторая: одна из одиннадцати.
    #   patterns:
    #     - "👍|🔥|💯|😁|🤡|❤️|🤣, 🔥|❤️|🤡|👏|👎|🤣|💯|👍|😁|🙏|🤔"

  # Сочетания записаны как есть, без обобщения: ровно те пары «первая реакция,
  # вторая реакция», которые Андрей отметил как нужные (19 постов, 12 пар).
  # Всё, чего нет в списке, считается ненужным.
  # Новое сочетание добавляется отдельной строкой в этот же список.
  - username: "UaOnlii"
    title: "Украина Online"
    reaction_pattern:
      enabled: true
      gate: true
      match: prefix
      patterns:
        - "🤬, 😁"
        - "🤬, 🙏"
        - "🤬, 😢"
        - "🤬, 🤯"
        - "🤬, 🔥"
        - "🤬, ❤️"
        - "🙏, 🤬"
        - "🙏, ❤️"
        - "😢, 😨"
        - "😢, 🙏"
        - "😢, 🤬"
        - "😁, 🤬"
    min_reactions: 0
    relative:
      enabled: false

  # Обычный канал: фильтруем по количеству реакций
  - username: "breakingmash"
    min_reactions: 1500

  - username: "rian_ru"
    min_reactions: 800
    keywords_exclude: ["реклама", "erid"]
